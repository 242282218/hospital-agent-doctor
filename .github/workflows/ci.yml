name: Runtime CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Run the deployment smoke checks"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read

jobs:
  runtime-checks:
    name: Python 3.9 runtime checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Check Python 3.9 compatibility
        run: python scripts/check_py39_compat.py

      - name: Compile runtime sources
        run: python -m compileall -q agent offline scripts

      - name: Normalize pinned text assets
        run: |
          git config core.autocrlf false
          python - <<'PY'
          from pathlib import Path

          for pattern in ("*.json", "*.py"):
              for path in Path(".").rglob(pattern):
                  if ".git" in path.parts:
                      continue
                  raw = path.read_bytes()
                  normalized = raw.replace(bytes((13, 10)), bytes((10,))).replace(
                      bytes((13,)), bytes((10,))
                  )
                  if normalized != raw:
                      path.write_bytes(normalized)
          PY

      - name: Run strict startup self-check
        run: python scripts/startup_selfcheck.py --pointer releases/current.json --expect-assets 9972

      - name: Run local health smoke
        run: |
          python - <<'PY'
          from agent.agent import build_agent
          from hospital_agent_sdk.server import create_agent_server

          agent = build_agent(release_pointer="releases/current.json")
          app = create_agent_server(test_handler=agent.test)
          response = app.test_client().get("/health")
          assert response.status_code == 200, response.data
          assert response.get_json() == {"status": "ok"}
          print("health smoke: ok")
          PY

      - name: Run offline regression suite
        run: python -m pytest -q

  docker-check:
    name: Docker build and health smoke
    runs-on: ubuntu-latest
    needs: runtime-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag hospital-agent-ci:${{ github.sha }} .

      - name: Start container
        run: docker run --detach --name hospital-agent-ci --publish 7860:7860 hospital-agent-ci:${{ github.sha }}

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7860/health; then
              echo
              echo "container health smoke: ok"
              exit 0
            fi
            sleep 2
          done
          docker logs hospital-agent-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs hospital-agent-ci

      - name: Remove container
        if: always()
        run: docker rm --force hospital-agent-ci || true
